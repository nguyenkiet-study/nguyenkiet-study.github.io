<script>
(function () {
'use strict';

/* =====================================================================
   Community, Messages and tags
   - Community: the 3-day topic, the Christmas question (1 Dec to 6 Jan), the word of the day and the board
     (posts, "Correct me", polls, word lists, shared answers). Hearts, comments, Save to Words. The admin can hide or delete.
   - Messages: 1-to-1 chats with any member, reactions, and the answers friends tagged you in. While a chat is open
     it checks for new messages every 8 seconds; elsewhere the red dot is refreshed when you change page.
   - Tags: K.social.tagBox(key) puts "Tag friends" under an answer box (Writing, the Words sentence, Grammar free writing);
     K.social.after(key, ctx) sends the answer to the tagged friends after the answer is checked and offers "Share to Community".
   - Other members are shown by name only. Usernames never leave the server.
   ===================================================================== */

var K = window.Kelvin, $ = K.$, $$ = K.$$, esc = K.esc, ic = K.ic;
var EMOJI = ['👍', '❤️', '😂', '😮', '😢', '🙏'];
var POLL_MS = 8000, BADGE_GAP = 15000, MEMBERS_GAP = 5 * 60 * 1000;
var S = {
  members: null, membersAt: 0, badge: { messages: 0, notifications: 0 }, badgeAt: 0,
  tags: {}, shares: [], picker: null, at: null,
  feed: null, filter: 'all', loading: false, err: '', posts: {},
  threads: null, thread: null, with: null, sig: '', re: '', sending: false, rxFor: null
};
var KIND = { correct: ['Correct me', 'i-spell'], poll: ['Poll', 'i-chart'], words: ['Word list', 'i-cards'], writing: ['Shared answer', 'i-pen'], wotd: ['Word of the day', 'i-bulb'], free: ['Post', 'i-message'], topic: ['Topic', 'i-users'], pinned: ['Christmas', 'i-gift'] };
/* Stickers: pictures in the website's stickers/ folder, sent as the text "[[sticker:id]]". */
var STK_BASE = location.protocol === 'file:' ? 'web/stickers/' : /github\.io$/.test(location.hostname) ? 'stickers/' : 'https://nguyenkiet-study.github.io/stickers/';
var PACKS = [
  { id: 'kel', name: 'Kelvin', ext: 'webp', items: ['wave', 'laugh', 'yay', 'thumbs-up', 'love', 'star-eyes', 'cool', 'party', 'thinking', 'surprised', 'shocked', 'calm', 'sleepy', 'worried', 'sad', 'angry',
    'grandpa', 'grandma', 'dad', 'mom', 'brother', 'sister', 'son', 'daughter', 'young-man', 'young-woman', 'boss', 'manager', 'teacher', 'doctor', 'engineer', 'developer', 'designer', 'student', 'chef', 'pilot', 'police',
    'reading', 'writing', 'listening', 'speaking', 'exam', 'travel', 'shopping', 'exercise', 'cooking', 'relax', 'sleep'] },
  { id: 'badge', name: 'Badges', ext: 'webp', items: ['fire', 'trophy', 'medal', 'star', 'check', 'yes', 'no', 'idea', 'rocket', 'goal', 'gift', 'bell', 'target', 'bullseye', 'growth', 'progress', 'calendar', 'headphones', 'microphone', 'book', 'notes', 'words', 'layers', 'info'] },
  { id: 'doodle', name: 'Doodles', ext: 'webp', items: ['doodle-grin', 'doodle-peace', 'doodle-please', 'doodle-point', 'doodle-shout', 'doodle-cry', 'doodle-cool', 'doodle-smug', 'doodle-dog', 'doodle-buddies', 'money'] },
  { id: 'bull', name: 'Niu Lai', ext: 'webp', items: ['bull-whatever', 'bull-shock', 'bull-cry', 'bull-side-eye', 'bull-arms-crossed', 'bull-nose', 'bull-doubt'] }
];
var STK = {};
PACKS.forEach(function (p) { p.items.forEach(function (it) { var id = p.id === 'kel' ? 'kel-' + it : p.id === 'badge' ? 'badge-' + it : it; STK[id] = { file: STK_BASE + id + '.' + p.ext, alt: it.replace(/^(kel|badge|doodle|bull)-/, '').replace(/-/g, ' ') }; }); });
function stickerId(t) { var m = /^\[\[sticker:([a-z0-9-]{2,40})\]\]$/.exec(String(t || '').trim()); return m ? m[1] : ''; }
function stickerImg(id, cls) { var k = STK[id]; return k ? '<img class="stk ' + (cls || '') + '" src="' + k.file + '" alt="Sticker: ' + esc(k.alt) + '" loading="lazy" draggable="false">' : '<span class="small muted">[Sticker]</span>'; }
var EMO = [
  ['Smileys', '😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 😉 😍 🥰 😘 😋 😛 😜 🤪 😎 🤓 🥳 🤩 😏 😌 😴 🤔 🤨 😐 😶 🙄 😬 😮 😯 😲 🥺 😢 😭 😤 😡 🤯 😳 🥵 🥶 😱 🤗 🤭 🫡 😷 🤒'],
  ['Hands', '👍 👎 👏 🙌 🙏 🤝 👋 ✌️ 🤞 🤟 👌 👊 💪 ✍️ 👀 🫶'],
  ['Hearts', '❤️ 🧡 💛 💚 💙 💜 🖤 🤍 💖 💯 ✨ 🔥 ⭐ 🌟'],
  ['Study and work', '📚 📖 ✏️ 📝 💡 🎯 ✅ ❌ ❓ ❗ 💼 💻 📅 ⏰ 🏆 🎓 🧠 🗣️ 🎧 📣'],
  ['Food and fun', '☕ 🍵 🧋 🍜 🍕 🍔 🍰 🍉 ⚽ 🏸 🎮 🎬 🎵 ✈️ 🏖️ 🚗'],
  ['Celebrate', '🎄 🎅 🎁 ❄️ ⛄ 🔔 🎉 🎊 🎆 🧧 🌸 🎂']
];
var SHARE_LABEL = { writing: 'Writing', words: 'Words sentence', grammar: 'Grammar', speaking: 'Speaking' };
var COLORS = ['#10234F', '#2864E8', '#0A9BD4', '#1D4ED8', '#0E7490', '#3B5BDB'];

/* ---------- helpers ---------- */
function api(fn, p) { return K.Api.call(fn, p || {}); }
function hl(t, w) {
  var stem = String(w || '').replace(/e$/, '').replace(/[^a-z' -]/gi, ''); if (!stem) return txt(t);
  var re = new RegExp('(\\b' + stem.replace(/[-' ]/g, '.') + '\\w*)', 'i'), m = String(t).match(re);
  if (!m) return txt(t);
  var i = String(t).search(re); return txt(t.slice(0, i)) + '<mark>' + esc(m[1]) + '</mark>' + txt(t.slice(i + m[1].length));
}
function txt(s) { return esc(s).replace(/\n/g, '<br>'); }
function hue(id) { var h = 0, s = String(id || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return COLORS[h % COLORS.length]; }
function initials(n) { var p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
function av(person, cls) {
  if (person && person.bot) return '<span class="cm-av bot ' + (cls || '') + '"><svg><use href="#logo"/></svg></span>';
  return '<span class="cm-av ' + (cls || '') + '" style="background:' + hue(person && person.id) + '">' + esc(initials(person && person.name)) + '</span>';
}
function when(iso) {
  var t = new Date(iso).getTime(); if (!t) return '';
  var d = (Date.now() - t) / 1000;
  if (d < 60) return 'now'; if (d < 3600) return Math.floor(d / 60) + 'm'; if (d < 86400) return Math.floor(d / 3600) + 'h';
  var dt = new Date(t); if (d < 6 * 86400) return dt.toLocaleDateString('en-GB', { weekday: 'short' });
  return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function clock(iso) { var d = new Date(iso); return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
function left(iso) {
  var d = (new Date(iso).getTime() - Date.now()) / 3600000; if (!(d > 0)) return 'ending now';
  return d >= 24 ? Math.round(d / 24) + (Math.round(d / 24) === 1 ? ' day left' : ' days left') : Math.ceil(d) + (Math.ceil(d) === 1 ? ' hour left' : ' hours left');
}
function isTouch() { return window.matchMedia && window.matchMedia('(pointer:coarse)').matches; }
function sheet(id, html, label) {
  var el = $('#' + id);
  if (!el) { document.body.insertAdjacentHTML('beforeend', '<div class="qw center cm-qw" id="' + id + '" role="dialog" aria-modal="true" aria-label="' + esc(label || 'Community') + '"></div>'); el = $('#' + id); }
  document.body.appendChild(el); // the newest sheet sits on top
  el.innerHTML = '<div class="qw-in cm-sheet">' + html + '</div>'; el.className = 'qw center cm-qw on';
  return el;
}
function closeSheet(id) { var el = $('#' + id); if (el) el.className = 'qw center cm-qw'; }
function head(title, id) { return '<div class="qw-head"><h2 class="qw-t">' + title + '</h2><button class="iconbtn" data-action="cm-close" data-s="' + id + '" aria-label="Close">' + ic('i-x') + '</button></div>'; }
function offline() { return '<div class="card cm-empty">' + ic('i-users', 'ic-lg') + '<h2>Community needs the server</h2><p class="small muted">Open Kelvin from its web address to see the group, the topic and your messages.</p></div>'; }

/* ---------- badge: red dot on Messages and Community ---------- */
function setDots() {
  var m = S.badge.messages || 0, n = S.badge.notifications || 0;
  $$('.msg-dot').forEach(function (d) { d.hidden = !m; d.textContent = m > 9 ? '9+' : m || ''; });
  $$('.cm-dot').forEach(function (d) { d.hidden = !n; });
}
function refreshBadge(force) {
  if (!K.live || !K.state.token) return;
  if (!force && Date.now() - S.badgeAt < BADGE_GAP) return setDots();
  S.badgeAt = Date.now();
  api('socialBadge').then(function (b) { S.badge = b; setDots(); }).catch(function () {});
}

/* ---------- members (for tags and new chats) ---------- */
function members() {
  if (S.members && Date.now() - S.membersAt < MEMBERS_GAP) return Promise.resolve(S.members);
  return api('members').then(function (r) { S.members = r.members; S.membersAt = Date.now(); return S.members; });
}

/* =====================================================================
   Tags
   ===================================================================== */
/* Mentions inside the answer box: type "@" and pick a friend from the list under the box.
   The name goes into the text as "@Full Name" and is shown on a blue background. Deleting the name from the text untags them. */
function norm(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }
function reEsc(t) { return String(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function mentionRe(name) { try { return new RegExp('@' + reEsc(name) + '(?![\\p{L}\\p{N}])', 'gu'); } catch (e) { return new RegExp('@' + reEsc(name) + '(?![A-Za-z0-9])', 'g'); } }
function tagNote(key) {
  var t = S.tags[key] || [];
  if (!t.length) return 'Type @ in your answer to tag friends. They get your answer in Messages.';
  var n = t.map(function (m) { return m.name; });
  return 'Tagging ' + (n.length > 1 ? n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1] : n[0]) + '. They get your answer in Messages.';
}
function tagBox(key) {
  if (!K.live) return '';
  setTimeout(wireAll, 0);
  return '<div class="tagbox" data-k="' + key + '"><button type="button" class="linkbtn" data-action="tg-open" data-k="' + key + '">' + ic('i-at', 'ic-sm') + 'Tag friends</button>' +
    '<span class="tiny muted tg-note">' + esc(tagNote(key)) + '</span></div>';
}
function redrawTags(key) { $$('.tagbox[data-k="' + key + '"] .tg-note').forEach(function (n) { n.textContent = tagNote(key); }); }
/* Finds the answer box that belongs to each tag box and adds the highlight layer and the friend list. */
function wireAll() {
  $$('.tagbox').forEach(function (tb) {
    var root = tb.closest('.card, .test-shell, .gr-run, #practice-card, article, section') || tb.parentElement;
    var ta = root && root.querySelector('textarea'); if (!ta || ta.dataset.mn) return;
    wire(ta, tb.dataset.k);
  });
}
var STYLE_KEYS = ['fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'letterSpacing', 'lineHeight', 'textTransform', 'wordSpacing', 'textIndent', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth', 'borderRadius', 'boxSizing'];
var IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function wire(ta, key) {
  ta.dataset.mn = key;
  var cs = getComputedStyle(ta), w = document.createElement('div'), bd = document.createElement('div'), ls = document.createElement('div');
  w.className = 'mn-wrap'; w.style.marginTop = cs.marginTop; w.style.marginBottom = cs.marginBottom; ta.style.marginTop = '0'; ta.style.marginBottom = '0';
  bd.className = 'mn-back'; bd.setAttribute('aria-hidden', 'true');
  ls.className = 'mn-list'; ls.hidden = true; ls.setAttribute('role', 'listbox');
  var had = document.activeElement === ta, sel = [ta.selectionStart, ta.selectionEnd];
  ta.parentNode.insertBefore(w, ta); w.appendChild(bd); w.appendChild(ta); w.appendChild(ls);
  if (had) { ta.focus(); try { ta.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
  STYLE_KEYS.forEach(function (k) { bd.style[k] = cs[k]; });
  if (IOS) { bd.style.paddingLeft = (parseFloat(cs.paddingLeft) + 3) + 'px'; bd.style.paddingRight = (parseFloat(cs.paddingRight) + 3) + 'px'; } // iPhone draws textarea text 3px further in
  ta.setAttribute('autocomplete', 'off');
  var st = { ta: ta, bd: bd, ls: ls, key: key, open: false, at: -1, q: '', hits: [], i: 0 };
  ta._mn = st;
  members().then(function () { sync(st); }).catch(function () {});
  ta.addEventListener('input', function () { sync(st); look(st); });
  ta.addEventListener('scroll', function () { bd.scrollTop = ta.scrollTop; });
  ta.addEventListener('click', function () { look(st); });
  ta.addEventListener('keyup', function (ev) { if (/Arrow(Left|Right)|Home|End/.test(ev.key)) look(st); });
  ta.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== ta) close(st); }, 150); });
  ta.addEventListener('keydown', function (ev) {
    if (!st.open || !st.hits.length) return;
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); st.i = (st.i + (ev.key === 'ArrowDown' ? 1 : st.hits.length - 1)) % st.hits.length; drawList(st); }
    else if (ev.key === 'Enter' || ev.key === 'Tab') { ev.preventDefault(); ev.stopPropagation(); choose(st, st.hits[st.i]); }
    else if (ev.key === 'Escape') { ev.preventDefault(); close(st); }
  }, true);
  /* pointerdown keeps the keyboard open while choosing */
  ls.addEventListener('pointerdown', function (ev) {
    var row = ev.target.closest('[data-id]'); ev.preventDefault(); if (!row) return;
    var m = (S.members || []).filter(function (x) { return x.id === row.dataset.id; })[0]; if (m) choose(st, m);
  });
  if (window.ResizeObserver) new ResizeObserver(function () { bd.scrollTop = ta.scrollTop; }).observe(ta);
  sync(st);
}
/* Tags = the friends whose "@Name" is in the text. Redraws the blue highlights. */
function sync(st) {
  var v = st.ta.value, ms = (S.members || []).slice().sort(function (a, b) { return b.name.length - a.name.length; });
  var marks = [], tagged = [];
  ms.forEach(function (m) {
    var re = mentionRe(m.name), r, hit = false;
    while ((r = re.exec(v))) {
      var a = r.index, b = a + r[0].length;
      if (marks.some(function (x) { return a < x[1] && b > x[0]; })) continue;
      marks.push([a, b]); hit = true;
    }
    if (hit) tagged.push(m);
  });
  marks.sort(function (x, y) { return x[0] - y[0]; });
  var h = '', at = 0;
  marks.forEach(function (x) { h += esc(v.slice(at, x[0])) + '<mark>' + esc(v.slice(x[0], x[1])) + '</mark>'; at = x[1]; });
  st.bd.innerHTML = h + esc(v.slice(at)) + '\n​';
  st.bd.scrollTop = st.ta.scrollTop;
  S.tags[st.key] = tagged.sort(function (a, b) { return v.indexOf('@' + a.name) - v.indexOf('@' + b.name); });
  redrawTags(st.key);
}
/* Is the cursor right after "@" plus a few letters? Then show matching friends. */
function look(st) {
  var v = st.ta.value, pos = st.ta.selectionStart, from = v.lastIndexOf('@', pos - 1);
  if (from < 0 || (from > 0 && !/\s|[(“"'‘]/.test(v.charAt(from - 1)))) return close(st);
  var q = v.slice(from + 1, pos);
  if (q.length > 30 || /\n|\s\s|^\s/.test(q)) return close(st);
  if (!S.members) { members().then(function () { look(st); }); return; }
  // A finished mention ("@Lan Tran and …") is not a search any more.
  if (S.members.some(function (m) { return q.indexOf(m.name) === 0 && (q.length === m.name.length ? false : !/[\p{L}\p{N}]/u.test(q.charAt(m.name.length))); })) return close(st);
  var nq = norm(q);
  var hits = S.members.filter(function (m) { var n = norm(m.name); return !nq || n.indexOf(nq) === 0 || n.indexOf(' ' + nq) > -1; }).slice(0, 6);
  if (q && hits.length === 1 && q === hits[0].name) return close(st);
  if (!hits.length && /\s/.test(q)) return close(st);
  st.open = true; st.at = from; st.q = q; st.hits = hits; st.i = 0; drawList(st);
}
function drawList(st) {
  st.ls.hidden = false;
  st.ls.innerHTML = st.hits.length ? st.hits.map(function (m, i) {
    return '<div class="mn-row' + (i === st.i ? ' on' : '') + '" role="option" aria-selected="' + (i === st.i) + '" data-id="' + esc(m.id) + '">' + av(m, 'sm') + '<span>' + esc(m.name) + '</span></div>';
  }).join('') : '<div class="mn-none">' + (S.members && S.members.length ? 'No friend called “' + esc(st.q) + '”.' : 'No other members yet.') + '</div>';
  try { st.ls.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
}
function close(st) { st.open = false; st.ls.hidden = true; st.hits = []; }
function choose(st, m) {
  var ta = st.ta, v = ta.value, pos = ta.selectionStart, end = pos;
  var put = '@' + m.name + ' ';
  if (v.charAt(end) === ' ') put = '@' + m.name;
  ta.value = v.slice(0, st.at) + put + v.slice(end);
  var c = st.at + put.length + (v.charAt(end) === ' ' ? 1 : 0);
  ta.focus(); try { ta.setSelectionRange(c, c); } catch (e) {}
  close(st); sync(st);
  try { ta.dispatchEvent(new Event('input', { bubbles: true })); } catch (e) {}
}
/* "Tag friends" button: puts "@" at the cursor and opens the list. */
function startTag(key) {
  var ta = $$('textarea').filter(function (t) { return t.dataset.mn === key; })[0];
  if (!ta) { wireAll(); ta = $$('textarea').filter(function (t) { return t.dataset.mn === key; })[0]; }
  if (!ta) return;
  var v = ta.value, pos = document.activeElement === ta ? ta.selectionStart : v.length;
  var lead = pos > 0 && !/\s/.test(v.charAt(pos - 1)) ? ' ' : '';
  ta.value = v.slice(0, pos) + lead + '@' + v.slice(pos);
  var c = pos + lead.length + 1; ta.focus(); try { ta.setSelectionRange(c, c); } catch (e) {}
  sync(ta._mn); look(ta._mn);
  try { ta.dispatchEvent(new Event('input', { bubbles: true })); } catch (e) {}
}
function openPicker(mode, key) {
  S.picker = { mode: mode, key: key, q: '' };
  sheet('cm-pick', head(mode === 'chat' ? 'New message' : 'Tag friends', 'cm-pick') + '<input class="input" id="pk-q" placeholder="Search by name" autocomplete="off"><div class="pk-list" id="pk-list"><p class="small muted">Loading…</p></div>' +
    (mode === 'tag' ? '<div class="row-between mt"><span class="tiny muted">No limit. Each person gets your answer as a message.</span><button class="btn btn-primary" data-action="cm-close" data-s="cm-pick">Done</button></div>' : ''), 'Pick members');
  members().then(drawPicker).catch(function (e) { $('#pk-list').innerHTML = '<p class="small muted">' + esc((e && e.message) || 'Could not load the members.') + '</p>'; });
  setTimeout(function () { var q = $('#pk-q'); if (q && !isTouch()) q.focus(); }, 60);
}
function drawPicker() {
  var p = S.picker, list = $('#pk-list'); if (!p || !list || !S.members) return;
  var q = p.q.toLowerCase(), sel = (S.tags[p.key] || []).map(function (m) { return m.id; });
  var ms = S.members.filter(function (m) { return !q || m.name.toLowerCase().indexOf(q) > -1; });
  list.innerHTML = ms.length ? ms.map(function (m) {
    var on = sel.indexOf(m.id) > -1;
    return '<button type="button" class="pk-row' + (on ? ' on' : '') + '" data-action="pk-pick" data-id="' + esc(m.id) + '">' + av(m) + '<span class="pk-n">' + esc(m.name) + '</span>' + (p.mode === 'tag' ? '<span class="pk-box">' + (on ? ic('i-check', 'ic-sm') : '') + '</span>' : ic('i-arrow', 'ic-sm')) + '</button>';
  }).join('') : '<p class="small muted">' + (S.members.length ? 'No one with that name.' : 'No other members yet. Invite friends to Kelvin first.') + '</p>';
}
function pick(id) {
  var p = S.picker, m = (S.members || []).filter(function (x) { return x.id === id; })[0]; if (!p || !m) return;
  closeSheet('cm-pick'); openChat(m.id, m.name);
}
/* After an answer is checked: send it to the tagged friends and offer "Share to Community".
   ctx: { skill, title, question, answer }. Returns a number for view(n), which gives the HTML to show under the feedback. */
function after(key, ctx) {
  if (!K.live || !ctx || !ctx.answer) return -1;
  var n = S.shares.length, tags = (S.tags[key] || []).slice(); S.tags[key] = [];
  var sh = { ctx: ctx, done: false, status: tags.length ? 'Sending to ' + tags.map(function (m) { return m.name.split(/\s+/)[0]; }).join(', ') + '…' : '', ok: false };
  S.shares.push(sh);
  if (tags.length) {
    api('tagSend', { to: tags.map(function (m) { return m.id; }), skill: ctx.skill, title: ctx.title, question: ctx.question, answer: ctx.answer })
      .then(function (r) { sh.ok = true; sh.status = 'Sent to ' + r.names.join(', ') + ' in Messages.'; paint(n); })
      .catch(function (e) { sh.status = (e && e.message) || 'Could not send it to your friends.'; paint(n); });
  }
  return n;
}
function view(n) {
  var sh = S.shares[n]; if (!sh) return '';
  return '<div class="soc-after" id="soc-' + n + '"><span class="small muted soc-st">' + (sh.ok ? ic('i-check', 'ic-sm') : '') + esc(sh.status) + '</span>' +
    (sh.done ? '<button type="button" class="btn btn-ghost btn-sm" data-go="community">' + ic('i-check', 'ic-sm') + 'Shared · Open</button>'
      : '<button type="button" class="btn btn-soft btn-sm" data-action="cm-share" data-s="' + n + '">' + ic('i-users', 'ic-sm') + 'Share to Community</button>') + '</div>';
}
function paint(n) { var el = $('#soc-' + n); if (el) el.outerHTML = view(n); }
function clearTags(key) { S.tags[key] = []; }
function shareSheet(n) {

    var pk = PACKS.filter(function (p) { return p.id === EMOP.tab; })[0];
    body = '<div class="stk-grid">' + pk.items.map(function (it) { var id = pk.id === 'kel' ? 'kel-' + it : pk.id === 'badge' ? 'badge-' + it : it; return '<button data-action="stk-pick" data-s="' + id + '" aria-label="' + esc(STK[id].alt) + '">' + stickerImg(id) + '</button>'; }).join('') + '</div>' +
      '<p class="tiny muted" style="margin-top:8px">Tap a sticker to send it.</p>';
  }
  sheet('cm-emo', head(EMOP.mode === 'react' ? 'React with an emoji' : stickers ? 'Emoji and stickers' : 'Emoji', 'cm-emo') +
    (tabs.length > 1 ? '<div class="cm-filters emo-tabs">' + tabs.map(function (t) { return '<button aria-selected="' + (EMOP.tab === t[0]) + '" data-action="emo-tab" data-t="' + t[0] + '">' + esc(t[1]) + '</button>'; }).join('') + '</div>' : '') +
    '<div class="emo-body">' + body + '</div>', 'Emoji');
}
function emoBtn(e) { return '<button data-action="emo-pick" data-e="' + e + '">' + e + '</button>'; }
function insertAt(el, t) {
  if (!el) return;
  var a = el.selectionStart == null ? el.value.length : el.selectionStart, b = el.selectionEnd == null ? a : el.selectionEnd;
  el.value = el.value.slice(0, a) + t + el.value.slice(b);
  var c = a + t.length; try { el.focus({ preventScroll: true }); el.setSelectionRange(c, c); } catch (x) {}
  try { el.dispatchEvent(new Event('input', { bubbles: true })); } catch (x) {}
}
function emoPick(e) {
  remember(e);
  if (EMOP.mode === 'react') { closeSheet('cm-emo'); return react(EMOP.id, e); }
  closeSheet('cm-emo');
  insertAt($(EMOP.mode === 'chat' ? '#ms-input' : EMOP.mode === 'comment' ? '#cmp-input' : '#cc-text'), e);
}
function stkPick(id) {
  closeSheet('cm-emo');
  var token = '[[sticker:' + id + ']]';
  if (EMOP.mode === 'chat') {
    var w = S.with; if (!w || S.sending) return; S.sending = true;
    api('msgSend', { to: w.id, text: token }).then(function (d) { S.sending = false; S.thread = d; S.sig = ''; if (K.state.view === 'messages') drawChat(false); var l = $('#ms-list'); if (l) l.scrollTop = l.scrollHeight; })
      .catch(function (e) { S.sending = false; K.toast((e && e.message) || 'Could not send the sticker.'); });
  } else if (EMOP.mode === 'comment') {
    api('cmComment', { postId: EMOP.id, text: token }).then(function (d) { S.posts[EMOP.id] = d.post; drawPost(d); patchPost(d.post, d.comments); var l = $('#cm-post .cm-sheet'); if (l) l.scrollTop = l.scrollHeight; })
      .catch(function (e) { K.toast((e && e.message) || 'Could not post the sticker.'); });
  }
}

/* ---------- views and wiring ---------- */
K.register('community', { title: 'Community', render: renderCommunity, refresh: function () {} });
K.register('messages', { title: 'Messages', render: renderMessages, refresh: function () {} });
K.onGo(function (view) {
  if (view !== 'messages') { document.body.classList.remove('in-chat'); }
  ['cm-post', 'cm-new', 'cm-n', 'cm-m', 'cm-ta', 'cm-share', 'cm-pick', 'cm-emo'].forEach(closeSheet);
  setTimeout(function () { refreshBadge(false); }, 0);
});
K.social = { tagBox: tagBox, after: after, view: view, clear: clearTags, openChat: openChat, refreshBadge: refreshBadge };

K.actions({
  'ms-reply-to': function (el) {
    var m = S.thread && S.thread.messages.filter(function (x) { return x.id === el.dataset.id; })[0]; if (!m) return;
    var full = stickerId(m.text) ? '[Sticker]' : m.text;
    startReply('chat', m.id, m.mine ? 'You' : S.with.name, '', full);
  },
  'ms-reply-x': function () { S.reply = null; drawChat(false); },
  'ms-goto': function (el) { flash($('.ms-msg[data-id="' + el.dataset.id + '"] .ms-b')); },
  'cm-reply': function (el) {
    var c = S.curPost && S.curPost.comments.filter(function (x) { return x.id === el.dataset.id; })[0];
    startReply('comment', el.dataset.id, el.dataset.name, '', c ? (stickerId(c.text) ? '[Sticker]' : c.text) : '');
  },
  'cm-reply-x': function () { S.creply = null; if (S.curPost) drawPost(S.curPost); },
  'cm-goto': function (el) { flash($('#cmt-' + el.dataset.id) || $('#cmp-body [data-qkind="post"]')); },
  'qt-reply': function (el) {
    var si = el._si; el.classList.remove('on'); if (!si) return;
    try { window.getSelection().removeAllRanges(); } catch (e) {}
    if (si.kind === 'chat') { var m = S.thread && S.thread.messages.filter(function (x) { return x.id === si.id; })[0]; startReply('chat', si.id, si.name, si.text, m ? m.text : si.text); }
    else startReply(si.kind === 'post' ? 'post' : 'comment', si.id, si.name, si.text, si.text);
  },
  'cm-close': function (el) { closeSheet(el.dataset.s); },
  'emo-open': function (el) { emoOpen(el.dataset.m, el.dataset.id); },
  'emo-tab': function (el) { EMOP.tab = el.dataset.t; drawEmo(); },
  'emo-pick': function (el) { emoPick(el.dataset.e); },
  'stk-pick': function (el) { stkPick(el.dataset.s); },
  'tg-open': function (el) { startTag(el.dataset.k); },
  'pk-pick': function (el) { pick(el.dataset.id); },
  'cm-share': function (el) { shareSheet(+el.dataset.s); },
  'cm-share-go': function (el) { shareGo(+el.dataset.s, el); },
  'ms-new': function () { openPicker('chat'); },
  'ms-open': function (el) { openChat(el.dataset.id, el.dataset.n); },
  'ms-back': function () { S.with = null; S.thread = null; S.re = ''; renderMessages(); },
  'ms-reload': renderMessages,
  'ms-send': sendMsg,
  'ms-reply': function (el) { S.re = el.dataset.q || ''; drawChat(false); var i = $('#ms-input'); if (i) i.focus(); },
  'ms-re-x': function () { S.re = ''; drawChat(false); },
  'ms-rx-open': function (el) { S.rxFor = S.rxFor === el.dataset.id ? null : el.dataset.id; drawChat(false); },
  'ms-react': function (el) { react(el.dataset.id, el.dataset.e); },
  'cm-filter': function (el) { S.filter = el.dataset.f; S.feed = null; drawFeed(); loadFeed(false); },
  'cm-reload': function () { loadFeed(false); },
  'cm-more': function () { loadFeed(true); },
  'cm-new': function () { compose('free'); },
  'cm-wotd': function (el) { compose('wotd', el.dataset.w); },
  'cc-kind': function (el) { COMPOSE.kind = el.dataset.k; drawCompose(); },
  'cc-post': function (el) { postNow(el); },
  'cm-open': function (el) { openPost(el.dataset.id); },
  'cmn-open': function (el) { closeSheet('cm-n'); if (el.dataset.id) openPost(el.dataset.id); },
  'cm-comment': function (el) { sendComment(el.dataset.id, el); },
  'cm-like': function (el) {
    var p = S.posts[el.dataset.id]; el.classList.toggle('on'); var sp = $('span', el);
    if (p) { p.liked = !p.liked; p.likes += p.liked ? 1 : -1; if (sp) sp.textContent = p.likes || ''; }
    api('cmLike', { id: el.dataset.id }).then(function (d) { if (p) { p.liked = d.liked; p.likes = d.likes; } if (sp) sp.textContent = d.likes || ''; el.classList.toggle('on', d.liked); }).catch(function (e) { K.toast((e && e.message) || 'Could not save the heart.'); });
  },
  'cm-clike': function (el) {
    el.classList.toggle('on');
    api('cmCommentLike', { id: el.dataset.id }).then(function (d) { el.classList.toggle('on', d.liked); el.innerHTML = ic('i-heart', 'ic-sm') + (d.likes ? '<span>' + d.likes + '</span>' : ''); }).catch(function (e) { K.toast((e && e.message) || 'Could not save the heart.'); });
  },
  'cm-vote': function (el) {
    api('cmVote', { id: el.dataset.id, option: +el.dataset.o }).then(function (p) { S.posts[p.id] = p; patchPost(p); if ($('#cm-post.on')) openPost(p.id); }).catch(function (e) { K.toast((e && e.message) || 'Could not vote.'); });
  },
  'cm-reveal': function (el) {
    var p = S.posts[el.dataset.id]; if (!p) return;
    sheet('cm-m', head('Which answer is right?', 'cm-m') + '<div class="cm-mlist">' + p.poll.options.map(function (o, i) { return '<button class="cm-mrow" data-action="cm-reveal-go" data-id="' + p.id + '" data-o="' + i + '">' + esc(o) + '</button>'; }).join('') + '</div>', 'Right answer');
  },
  'cm-reveal-go': function (el) {
    api('cmReveal', { id: el.dataset.id, answer: +el.dataset.o }).then(function (p) { closeSheet('cm-m'); S.posts[p.id] = p; patchPost(p); }).catch(function (e) { K.toast((e && e.message) || 'Could not save.'); });
  },
  'cm-menu': function (el) { menu(el); },
  'cm-hide': function (el) { moderate('cm-hide', el.dataset.t, el.dataset.id, el); },
  'cm-del': function (el) { moderate('cm-del', el.dataset.t, el.dataset.id, el); },
  'cm-notifs': notifs,
  'cm-save': function (el) {
    el.disabled = true;
    saveWord(el.dataset.w, el.dataset.c).then(function (r) { K.toast(r.already ? '“' + el.dataset.w + '” is already in Words.' : 'Saved “' + el.dataset.w + '” to Words.'); el.disabled = false; })
      .catch(function (e) { el.disabled = false; K.toast((e && e.message) || 'Could not save that word.'); });
  },
  'cm-saveall': function (el) {
    var p = S.posts[el.dataset.id]; if (!p) return; el.disabled = true;
    var list = p.words.slice(), n = 0;
    (function nextWord() {
      var w = list.shift(); if (!w) { el.disabled = false; return K.toast(n ? 'Saved ' + n + (n === 1 ? ' word' : ' words') + ' to Words.' : 'These words are already in Words.'); }
      saveWord(w.w, w.m).then(function (r) { if (!r.already) n++; nextWord(); }).catch(function (e) { el.disabled = false; K.toast((e && e.message) || 'Could not save every word.'); });
    })();
  },
  'cm-say': function (el) { if (K.words && K.words.speak) K.words.speak(el.dataset.w); },
  'tp-admin': topicAdmin,
  'ta-save': function (el) {
    var t = ($('#ta-text').value || '').trim(); if (t.length < 10) return K.toast('Write a topic of a few words.');
    el.disabled = true; api('topicEdit', { text: t }).then(function (d) { drawTopicAdmin(d); K.toast('Saved. It goes live when this topic ends.'); }).catch(function (e) { el.disabled = false; K.toast((e && e.message) || 'Could not save.'); });
  },
  'ta-now': function (el) {
    if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = 'Tap again to start now'; return; }
    el.disabled = true; api('topicPublish').then(function (d) { drawTopicAdmin(d); S.feed = null; loadFeed(false); K.toast('The new topic is live.'); }).catch(function (e) { el.disabled = false; K.toast((e && e.message) || 'Could not start it.'); });
  }
});

document.addEventListener('input', function (ev) { if (ev.target && ev.target.id === 'pk-q' && S.picker) { S.picker.q = ev.target.value; drawPicker(); } });
/* Close the reaction bar when tapping elsewhere in the chat. */
document.addEventListener('click', function (ev) { if (S.rxFor && !ev.target.closest('.ms-rxbar, .ms-rx-open, .ms-rx')) { S.rxFor = null; if (K.state.view === 'messages' && S.with) drawChat(false); } }, true);
})();
</script>
