<script>
(function () {
'use strict';

/* =====================================================================
   Words module (real data)
   - No daily limit on new words. You set a daily study time (Settings), review what is due and learn new words
     in rounds of 5, 10 or 15. Your saved words come first in every round.
   - Five Leitner boxes. The server holds the boxes and the due dates; the browser reports one result per word at the
     end of a session: "ok", "hint" (right, but with a hint: the box stays) or "miss" (back to box 1).
   - The kind of exercise follows the box: the higher the box, the more you have to recall by yourself.
       new / box 1  choose the meaning, then fill the blank with the first letter given
       box 2        fill the blank from the meaning, no letters
       box 3        hear the word and type it, or type it from its meaning
       box 4        word partners, Vietnamese to English, or the closest word (similar meaning)
       box 5        answer a question using the word, or the opposite word
   - Similar and opposite words are never shown with a new word (learning two close words at once makes both harder).
     From box 3 they appear after each answer, with a short note on the difference.
   - A word you miss comes back a few cards later as a different exercise, until you get it right.
   - Every answer here is graded by this code. AI is used only for a short note on your own sentence at the end of a round,
     and (in the background) to write more example sentences, so reviews do not show the same sentence every time.
   - Example sentences keep the target word in [brackets]. The brackets are removed on screen.
   ===================================================================== */

var K = window.Kelvin, $ = K.$, $$ = K.$$, esc = K.esc, ic = K.ic;
var LV = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
var BOX_DAYS = [1, 2, 4, 8, 16];
var LIVE = K.live;

var W = { t: null, err: null, showVi: false, filter: 'due', page: 0, items: null, total: 0, pageSize: 20, run: null, profile: null, loadingList: false, sv: null, svFilter: 'all', svPage: 0, recent: [], autoStart: false, next: null, busy: false };

/* ---------- helpers ---------- */
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function dueLabel(d, st) { return st === 'knew' ? 'Already known' : st === 'new' ? 'Not started' : d <= 0 ? 'Today' : d === 1 ? 'Tomorrow' : 'In ' + d + ' days'; }
function lev(a, b) {
  var m = [], i, j;
  for (i = 0; i <= a.length; i++) m[i] = [i];
  for (j = 1; j <= b.length; j++) m[0][j] = j;
  for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return m[a.length][b.length];
}
/* typed answer check: exact, or one slip in a word of five letters or more */
function gradeTyped(input, accepted) {
  var v = String(input).trim().toLowerCase().replace(/[^a-z' -]/g, '').replace(/\s+/g, ' '), best = null;
  if (!v) return { ok: false, empty: true };
  for (var i = 0; i < accepted.length; i++) {
    var a = String(accepted[i]).toLowerCase();
    if (v === a) return { ok: true, exact: true };
    if (a.length >= 5 && lev(v, a) === 1) best = a;
  }
  return best ? { ok: true, near: best } : { ok: false };
}
/* "before the [deadline] on Friday" -> { pre, form, post } */
function parts(ex, word) {
  var m = /^([\s\S]*?)\[([^\]]+)\]([\s\S]*)$/.exec(String(ex || ''));
  if (m) return { pre: m[1], form: m[2], post: m[3] };
  var re = new RegExp('\\b' + String(word).replace(/e$/, '').replace(/[^a-z]/gi, '') + '\\w*', 'i'), mm = String(ex || '').match(re);
  if (!mm) return { pre: String(ex || '') + ' ', form: word, post: '' };
  var at = mm.index;
  return { pre: ex.slice(0, at), form: mm[0], post: ex.slice(at + mm[0].length) };
}
function blankHtml(ex, word) { var p = parts(ex, word); return esc(p.pre) + '<span class="blank"></span>' + esc(p.post); }
function highlight(ex, word) { var p = parts(ex, word); return esc(p.pre) + '<mark>' + esc(p.form) + '</mark>' + esc(p.post); }
function boxes(n) { var h = '<span class="boxes" aria-label="Box ' + n + ' of 5">'; for (var i = 1; i <= 5; i++) h += '<i class="' + (i <= n ? 'on' : '') + '"></i>'; return h + '</span>'; }
function speak(w) { K.say(w, 0.9); }
function root() { return W.run && W.run.where === 'quick' ? qwBody() : $('#words-root'); }
function studying() { return !!(K.study && K.study.active()); }
function hash(s) { var h = 0; s = String(s); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function nWords(n) { return n + (n === 1 ? ' word' : ' words'); }
function mins(sec) { return Math.floor((Number(sec) || 0) / 60); }
/* "d _ _ _ _ _ _ _" for deadline; each word of a phrase gets its own first letter */
function pattern(ans) { return String(ans).split(' ').map(function (w) { return w.charAt(0) + new Array(w.length).join(' _'); }).join('   '); }
function letters(ans) { var n = String(ans).replace(/[^A-Za-z]/g, '').length; return n + (n === 1 ? ' letter' : ' letters'); }
function usesWord(text, w) {
  var first = String(w).toLowerCase().split(/[ -]/)[0], stem = first.length <= 4 ? first : first.replace(/e$/, '').slice(0, Math.max(3, first.length - 3));
  return String(text).toLowerCase().indexOf(stem) > -1;
}
function wordCount(t) { return String(t).trim().split(/\s+/).filter(Boolean).length; }

/* ---------- loading ---------- */
function render() {
  if (W.run && W.run.where === 'quick') closeQuick();
  W.run = null; if (K.study) K.study.reset();
  if (!LIVE) { root().innerHTML = '<article class="card"><h2>Words</h2><p class="muted mt">Words connects to your word bank, so it only runs in the live app.</p></article>'; return; }
  if (!W.t) root().innerHTML = '<article class="card"><p class="muted">Loading your words…</p></article>';
  load();
}
function load() {
  W.err = null;
  return K.Api.call('wordsToday').then(function (t) {
    W.t = t; W.profile = t.profile || W.profile; W.next = null;
    if (W.autoStart && K.state.view === 'words' && !W.run) { W.autoStart = false; if (startToday()) return; }
    if (K.state.view === 'words' && !W.run) draw(); loadList(true); loadSaved(true);
  })
    .catch(function (e) { W.err = (e && e.message) || 'Could not load your words.'; if (K.state.view === 'words' && !W.run) draw(); });
}
function loadList(quiet) {
  if (!W.t || !W.t.ready) return;
  W.loadingList = true;
  return K.Api.call('wordsList', { filter: W.filter, page: W.page }).then(function (r) {
    W.items = r.items; W.total = r.total; W.pageSize = r.pageSize; W.loadingList = false; if (K.state.view === 'words' && !W.run) draw();
  }).catch(function (e) { W.loadingList = false; if (!quiet) K.toast((e && e.message) || 'Could not load the list.'); });
}

function loadSaved(quiet) {
  return K.Api.call('savedList', { filter: W.svFilter, page: W.svPage }).then(function (r) {
    W.sv = r; if (K.state.view === 'words' && !W.run) draw();
  }).catch(function (e) { if (!quiet) K.toast((e && e.message) || 'Could not load your saved words.'); });
}

/* ---------- Words page ---------- */
function roundCount(t) { return t && t.round ? t.round.fresh.length + t.round.saved.items.length : 0; }
function reviewCount(t) { return t && t.review ? t.review.review.length + t.review.saved.items.length : 0; }
/* The goal line: minutes studied today against the goal. */
function goalHtml(g) {
  var done = mins(g.doneSec), pct = Math.min(100, Math.round(g.doneSec / Math.max(60, g.minutes * 60) * 100)), ok = g.doneSec >= g.minutes * 60;
  return '<div class="goal-line"><div class="row-between" style="gap:8px"><span class="small"><b>Today: <span class="num">' + done + '</span> of ' + g.minutes + ' min</b>' + (ok ? ' <span class="pill ok-pill">Goal reached</span>' : '') + '</span><span class="tiny muted">Change the goal in Settings</span></div><div class="wd-bar" style="margin:8px 0 0"><i style="width:' + pct + '%"></i></div></div>';
}
/* What to say when reviews are piling up. */
function loadNote(g) {
  if (g.state === 'ok') return '';
  var head = '<b>' + g.due + ' reviews are waiting</b>, about ' + g.dueMin + ' min. ';
  if (g.state === 'warn') return '<div class="wd-note warn" role="status">' + head + 'Review first, so they do not pile up.</div>';
  return '<div class="wd-note stop" role="status">' + head + (g.reduced ? 'New rounds are down to ' + g.reducedRound + ' words until you catch up. Your saved words are not cut.' : 'That is more than your daily goal. Review before you learn more.') + '</div>';
}
function todayCard(t) {
  var g = t.goal, s = t.stats, rv = reviewCount(t), rd = roundCount(t), urgent = g.state !== 'ok' && rv > 0;
  var sizes = '<label class="small muted round-size">Round of <select class="input" id="wd-size" aria-label="New words per round">' + g.sizes.map(function (n) { return '<option value="' + n + '"' + (g.round === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></label>';
  var learnLabel = rd ? 'Learn ' + rd + ' new ' + (rd === 1 ? 'word' : 'words') : 'No new words ready';
  var reviewBtn = rv ? '<button class="btn ' + (urgent || !rd ? 'btn-primary' : 'btn-soft') + '" data-action="wd-review">Review ' + (g.due > rv ? rv + ' of ' + g.due : rv) + '</button>' : '';
  var learnBtn = '<button class="btn ' + (urgent ? 'btn-soft' : 'btn-primary') + '" data-action="wd-learn"' + (rd ? '' : ' disabled') + '>' + learnLabel + '</button>';
  return '<article class="card sk-words"><div class="card-head"><h2>' + ic('i-cards', 'ic-sm') + 'Today\'s words</h2><span class="pill plain">' + (g.due ? g.due + ' to review' : 'No reviews waiting') + '</span></div>' +
    goalHtml(g) + loadNote(g) +
    '<div class="wd-stats"><div class="wd-stat"><b class="num">' + g.due + '</b><span class="small muted">to review</span></div><div class="wd-stat"><b class="num">' + g.newToday + '</b><span class="small muted">new today</span></div><div class="wd-stat"><b class="num">' + s.known + '</b><span class="small muted">mastered</span></div><div class="wd-stat"><b class="num">' + (s.knew || 0) + '</b><span class="small muted">already knew</span></div></div>' +
    '<div class="form-banner" id="wd-banner" role="alert"></div>' +
    '<div class="round-row">' + (urgent ? reviewBtn + learnBtn : learnBtn + reviewBtn) + sizes + '</div>' +
    '<p class="tiny muted" style="margin-top:12px">No daily limit: learn as many rounds as you like. A steady pace for a ' + g.minutes + '-minute goal is about ' + g.suggest + ' new words a day.' +
    (g.savedFresh ? ' Your saved words come first (' + g.savedFresh + ' waiting).' : '') + (g.tomorrow ? ' By tomorrow: about ' + g.tomorrow + ' ' + (g.tomorrow === 1 ? 'review' : 'reviews') + ' (' + g.tomorrowMin + ' min).' : '') + '</p></article>';
}
function draw() {
  if (W.run) return drawRun();
  if (studying()) return;
  var r = root();
  if (W.err && !W.t) { r.innerHTML = '<article class="card"><h2>Words</h2><p class="muted mt">' + esc(W.err) + '</p><button class="btn btn-soft mt" data-action="wd-retry">Try again</button></article>'; return; }
  if (!W.t) return;
  var t = W.t;
  if (!t.ready) {
    r.innerHTML = '<article class="card"><div class="card-head"><h2>Words</h2><span class="pill warn">Not ready yet</span></div><p class="muted">The word bank is still being prepared. Each word needs a definition, an example and word partners before it can be taught.</p>' +
      '<p class="small muted mt">If you manage this app, open the sheet menu: Kelvin, then Generate word content. It runs in the background and fills the bank step by step.</p>' +
      '<div class="callout mt" style="margin-bottom:0"><span class="ico">' + ic('i-cards') + '</span><div class="grow small"><b>Ready words: ' + t.bank.approved + '</b><div class="muted">Waiting for content: ' + t.bank.pending + '</div></div></div></article>' +
      (roundCount(t) + reviewCount(t) ? '<div class="mt">' + todayCard(t) + '</div>' : '');
    return;
  }
  var s = t.stats;
  var bars = s.levels.map(function (l) {
    var tt = l.total || 1;
    return '<div class="r"><b>' + l.lvl + '</b><div class="t"><i class="k" style="width:' + l.known / tt * 100 + '%"></i><i class="l" style="width:' + l.learning / tt * 100 + '%"></i></div><span class="muted num">' + (l.known + l.learning) + ' of ' + l.total + '</span></div>';
  }).join('');
  var prof = W.profile ? profileHtml(W.profile) : '<p class="muted">A 3-minute check shows whether the gap is size (too few words), recall (you know words but cannot use them) or word partners (which words go together).</p><button class="btn btn-soft mt" data-action="wd-check">Take the vocabulary check</button>';
  r.innerHTML = '<div class="grid g-7-5">' + todayCard(t) +
    '<article class="card"><div class="card-head"><h2>Your word bank</h2><span class="pill plain">' + t.bank.approved + ' words</span></div><div class="lvbars">' + bars + '</div><div class="legend" style="margin-top:6px"><span><i style="border-color:var(--primary)"></i>Known</span><span><i style="border-color:#B5CEFF"></i>Learning</span></div></article></div>' +
    (K.study ? '<div class="mt">' + K.study.card(t) + '</div>' : '') +
    (K.drill ? '<article class="card mt">' + K.drill.entry('words', true) + '</article>' : '') +
    '<div class="grid g-2 mt"><article class="card"><div class="card-head"><h2>Vocabulary profile</h2></div>' + prof + '</article>' +
    '<article class="card"><div class="card-head"><h2>How review works</h2></div><p class="muted small" style="margin-bottom:12px">Each word sits in a box. A right answer moves it up and the next review comes later. A right answer with a hint keeps the box; if you need to see more letters of the word, it counts as a wrong answer. A wrong answer sends it back to box 1, and the word comes back in the same session until you get it. The higher the box, the more you recall by yourself.</p><div class="boxladder">' + BOX_DAYS.map(function (d, i) { return '<div><b>Box ' + (i + 1) + '</b>' + d + (d === 1 ? ' day' : ' days') + '</div>'; }).join('') + '</div></article></div>' +
    savedCard() + '<article class="card mt wd-mine"><div class="card-head"><h2>' + ic('i-layers', 'ic-sm') + 'My words</h2><div class="row-between" style="gap:10px"><div class="filters" role="group" aria-label="Filter words">' +
    [['due', 'Due today'], ['new', 'New'], ['learning', 'Learning'], ['known', 'Known'], ['all', 'All']].map(function (f) { return '<button data-action="wd-filter" data-f="' + f[0] + '" aria-pressed="' + (W.filter === f[0]) + '">' + f[1] + '</button>'; }).join('') + '</div>' +
    '<button class="btn btn-ghost btn-sm" data-action="wd-vi" aria-pressed="' + W.showVi + '">' + ic('i-eye', 'ic-sm') + (W.showVi ? 'Hide' : 'Show') + ' Vietnamese</button></div></div><div id="wd-list">' + listHtml() + '</div></article>';
}
function knowBtn(x) {
  if (x.status === 'knew') return '<button class="btn btn-ghost btn-sm" data-action="wd-again" data-id="' + esc(x.id) + '">' + ic('i-repeat', 'ic-sm') + 'Study again</button>';
  return '<button class="btn btn-ghost btn-sm" data-action="wd-know-row" data-id="' + esc(x.id) + '" data-w="' + esc(x.w) + '" aria-label="I know ' + esc(x.w) + '">' + ic('i-check', 'ic-sm') + 'I know it</button>';
}
function savedCard() {
  var c = W.t && W.t.saved ? W.t.saved.counts : null, sv = W.sv;
  var head = '<div class="card-head"><h2>' + ic('i-bookmark', 'ic-sm') + 'Saved from practice</h2><span class="pill plain">' + (c ? c.total : 0) + ' saved</span></div>';
  if (c && !c.total && (!sv || !sv.total)) return '<article class="card mt sk-words">' + head + '<p class="muted">Anywhere in Kelvin, select an English word or phrase and tap Save. It shows up here and comes first in your next round, with its own sentence.</p></article>';
  var pages = sv ? Math.ceil(sv.total / sv.pageSize) : 0;
  return '<article class="card mt sk-words">' + head + '<div class="filters" role="group" aria-label="Filter saved words" style="margin-bottom:8px">' +
    [['all', 'All'], ['due', 'Due'], ['new', 'New'], ['learning', 'Learning'], ['known', 'Known']].map(function (f) { return '<button data-action="wd-sfilter" data-f="' + f[0] + '" aria-pressed="' + (W.svFilter === f[0]) + '">' + f[1] + '</button>'; }).join('') + '</div>' +
    (!sv ? '<p class="muted">Loading…</p>' : !sv.items.length ? '<p class="muted">Nothing here.</p>' : sv.items.map(function (x) {
      return '<div class="srow"><div style="min-width:0"><div class="w">' + esc(x.w) + ' <span class="tiny muted" style="font-weight:500">' + esc(x.skill) + '</span></div>' +
        (x.def ? '<div class="d">' + esc(x.def) + (W.showVi && x.vi ? ' <span class="muted">(' + esc(x.vi) + ')</span>' : '') + '</div>' : '') +
        (x.ctx ? '<div class="c">' + esc(x.ctx) + '</div>' : '') + '</div>' + boxes(x.box) + '<span class="due">' + dueLabel(x.due, x.status) + '</span>' +
        '<div class="row-btns">' + knowBtn(x) + '<button class="btn btn-ghost btn-sm" data-action="wd-sdel" data-id="' + esc(x.id) + '" aria-label="Remove ' + esc(x.w) + '">Remove</button></div></div>';
    }).join('')) +
    (pages > 1 ? '<div class="row-between mt"><button class="btn btn-ghost btn-sm" data-action="wd-spage" data-d="-1"' + (W.svPage === 0 ? ' disabled' : '') + '>Previous</button><span class="small muted num">Page ' + (W.svPage + 1) + ' of ' + pages + '</span><button class="btn btn-ghost btn-sm" data-action="wd-spage" data-d="1"' + (W.svPage >= pages - 1 ? ' disabled' : '') + '>Next</button></div>' : '') + '</article>';
}
function listHtml() {
  if (!W.items) return '<p class="muted">Loading…</p>';
  if (!W.items.length) return '<p class="muted">' + ({ due: 'Nothing to review today. Words come back here on the day they are due.', new: 'No new words waiting. Tap Learn new words to add some.', learning: 'No words in progress yet. Words you have started show up here.', known: 'No known words yet. A word counts as known once it reaches the last box, or when you mark it "I know this word".' }[W.filter] || 'No words yet. Start a round in Words to fill this list.') + '</p>';
  var pages = Math.ceil(W.total / W.pageSize);
  return W.items.map(function (x) {
    return '<div class="wrow"><div><div class="w">' + esc(x.w) + '</div><div class="p">' + esc(x.pos) + (W.showVi && x.vi ? ', ' + esc(x.vi) : '') + '</div></div><div class="d">' + esc(x.def) + '</div><span class="pill lvl" style="--c:var(--primary)">' + esc(x.lvl) + '</span>' + boxes(x.box) + '<span class="due">' + dueLabel(x.due, x.status) + '</span><button class="iconbtn" data-action="wd-speak" data-w="' + esc(x.w) + '" aria-label="Hear ' + esc(x.w) + '">' + ic('i-volume') + '</button>' + knowBtn(x) + '</div>';
  }).join('') + (pages > 1 ? '<div class="row-between mt"><button class="btn btn-ghost btn-sm" data-action="wd-page" data-d="-1"' + (W.page === 0 ? ' disabled' : '') + '>Previous</button><span class="small muted num">Page ' + (W.page + 1) + ' of ' + pages + ' (' + W.total + ' words)</span><button class="btn btn-ghost btn-sm" data-action="wd-page" data-d="1"' + (W.page >= pages - 1 ? ' disabled' : '') + '>Next</button></div>' : '');
}
function profileHtml(p) {
  function row(l, v) { return '<div class="diag-row"><span>' + l + '</span><div class="bar"><i style="width:' + v + '%"></i></div><b class="num">' + v + '%</b></div>'; }
  return row('Recognise meaning', p.rec) + row('Recall the word', p.prod) + row('Word partners', p.col) + '<p style="margin-top:12px"><b>' + esc(p.title) + '</b></p><p class="muted small">' + esc(p.text) + '</p><p class="tiny muted" style="margin-top:8px">Based on your latest check of 12 words. Retake it every few weeks to see it change.</p><button class="btn btn-ghost btn-sm mt" data-action="wd-check">Retake the check</button>';
}

/* ---------- building a session ---------- */
var LABEL = { syn: 'Closest meaning', ant: 'Opposite', intro: 'New word', meaning: 'Choose the meaning', cloze: 'Fill in the blank', coll: 'Choose the word partner', def: 'Type the word', listen: 'Listen and type', vi: 'Vietnamese to English', ask: 'Answer with the word', use: 'Use it yourself' };
var TYPED = { cloze: 1, def: 1, listen: 1, vi: 1, ask: 1 };
var RANK = { ok: 0, hint: 1, miss: 2 };

function mapSaved(x) { return { id: x.id, w: x.w, pos: '', lvl: '', def: x.def || '', ex: x.ex || '', ex2: x.ex2 || [], q: x.q || '', rel: x.rel || null, det: x.det || null, more: !!x.more, coll: [], vi: x.vi || '', quiz: null, box: x.box, status: x.status, saved: true, skill: x.skill }; }
function savedItems(d) { return ((d && d.saved && d.saved.items) || []).map(mapSaved); }
function canMeaning(run, x) { return x.def && (run.pool.length - 1 + run.extra.length) >= 3; }
function canListen() { return K.canSpeak(); }
/* "closest meaning" (syn) or "opposite" (ant): needs the related word and three other words to choose from */
/* ---------- word details: part of speech, pronunciation, similar words, word family ---------- */
var POS_VI = { noun: 'danh từ', verb: 'động từ', adjective: 'tính từ', adverb: 'trạng từ', preposition: 'giới từ', conjunction: 'liên từ', pronoun: 'đại từ', determiner: 'từ hạn định', phrase: 'cụm từ', 'phrasal verb': 'cụm động từ', idiom: 'thành ngữ', interjection: 'thán từ', article: 'mạo từ', modal: 'động từ khuyết thiếu', 'modal verb': 'động từ khuyết thiếu', number: 'số từ' };
var POS_C = { noun: 'n', verb: 'v', 'phrasal verb': 'v', modal: 'v', 'modal verb': 'v', adjective: 'a', adverb: 'r', phrase: 'p', idiom: 'p' };
function posTag(pos) {
  if (/[,\/]/.test(String(pos || ''))) return String(pos).split(/\s*[,\/]\s*/).filter(Boolean).slice(0, 3).map(posTag).join(' ');
  pos = String(pos || '').toLowerCase().trim().replace(/\.$/, ''); if (!pos) return '';
  pos = { n: 'noun', v: 'verb', adj: 'adjective', adv: 'adverb', prep: 'preposition', conj: 'conjunction', pron: 'pronoun', det: 'determiner', phr: 'phrase', 'phr v': 'phrasal verb', 'phr. v': 'phrasal verb', int: 'interjection', art: 'article' }[pos] || pos;
  var vi = (K.state.settings.studyLang || 'vi') === 'vi' ? POS_VI[pos] : '';
  return '<span class="pos-tag pos-' + (POS_C[pos] || 'o') + '">' + esc(pos) + (vi ? '<i>' + esc(vi) + '</i>' : '') + '</span>';
}
function ipaHtml(wd) {

  var w = planWords();
  if (!K.study || !LIVE || !w || !w.ready && !(w.sets && w.sets.learned)) return '';
  return K.study.card({ sets: w.sets || {} }, where);
}
function dashStudy() { var el = $('#dash-study'); if (el) el.innerHTML = studyMini('dashboard'); }
function hubCard() {
  var w = planWords(), due = w ? (w.ready ? w.due : 0) + (w.savedDue || 0) : 0, g = w && w.goal, pct = g ? Math.min(100, Math.round(g.doneSec / 60 / g.minutes * 100)) : 0;
  return '<button class="hub-tile sk-words" data-go="words"><span class="tint ht-ico">' + ic('i-cards', 'ic-sm') + '</span><span class="ht-name">Words</span>' +
    '<span class="ht-sub">' + (due ? '<b>' + due + '</b> to review' : 'Up to date') + '</span><span class="bar ht-bar"><i style="width:' + pct + '%"></i></span></button>';
}

/* ---------- saving words while practising ---------- */
/* Select an English word or short phrase anywhere in the app (passages, questions, feedback, grammar lessons, word cards, the plan).
   A small button appears; tapping it saves the text with the sentence around it. Not in typing boxes, buttons, menus or the sign-in screen. */
var capBar = null, capInfo = null, capTimer = 0, capPress = false;
var CAP_SKIP = 'input, textarea, select, button, [contenteditable], nav, .side, .bottom-nav, #cap-bar, .toast, .no-cap';
function capClean(raw) {
  var t = String(raw || '').replace(/\s+/g, ' ').trim().replace(/^[^A-Za-z]+/, '').replace(/[^A-Za-z]+$/, '');
  if (t.length < 2 || t.length > 40 || !/^[A-Za-z][A-Za-z'’\- ]*[A-Za-z]$/.test(t) || t.split(' ').length > 4) return '';
  return t;
}
/* The block of text a selection sits in: a marked .cap block, or the nearest element that is not inline. */
function capBlock(n) {
  var cap = n.closest('.cap'); if (cap) return cap;
  var el = n, hops = 0;
  while (el.parentElement && hops++ < 6) { var d = ''; try { d = getComputedStyle(el).display; } catch (e) {} if (d && d.indexOf('inline') !== 0 && d !== 'contents') break; el = el.parentElement; }
  return el;
}
function capRead() {
  var sel = window.getSelection ? window.getSelection() : null;
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
  var rg = sel.getRangeAt(0), n = rg.commonAncestorContainer; n = n.nodeType === 1 ? n : n.parentElement;
  if (!n || !n.closest || !(n.closest('#screen-app') || n.closest('.qw')) || n.closest(CAP_SKIP)) return null;
  var text = capClean(sel.toString()); if (!text) return null;
  var cap = capBlock(n), marked = cap.classList && cap.classList.contains('cap');
  var pre = document.createRange(); pre.selectNodeContents(cap); pre.setEnd(rg.startContainer, rg.startOffset);
  var full = cap.textContent, a = pre.toString().length, b = a + sel.toString().length, i = a, j = b;
  while (i > 0 && !/[.!?\n]/.test(full.charAt(i - 1))) i--;
  while (j < full.length && !/[.!?\n]/.test(full.charAt(j))) j++;
  if (j < full.length) j++;
  var ctx = full.slice(i, j).replace(/\s+/g, ' ').trim();
  if (ctx.length > 240) ctx = full.slice(Math.max(0, a - 100), Math.min(full.length, b + 100)).replace(/\s+/g, ' ').trim();
  if (!/[A-Za-z]{2,}\s+[A-Za-z]{2,}/.test(ctx.replace(text, ' '))) ctx = marked ? ctx : '';   // a lone label is not a sentence: save the word without one
  return { text: text, context: ctx, skill: (cap.getAttribute && cap.getAttribute('data-skill')) || K.state.view };
}
function capShow(info) {
  if (!capBar) {
    capBar = document.createElement('div'); capBar.id = 'cap-bar'; capBar.setAttribute('role', 'status');
    capBar.innerHTML = '<button type="button" data-action="cap-save"></button>'; document.body.appendChild(capBar);
    ['pointerdown', 'mousedown', 'touchstart'].forEach(function (ev) { capBar.addEventListener(ev, function (e) { capPress = true; if (ev !== 'touchstart') e.preventDefault(); }, { passive: false }); });
  }
  capBar.firstChild.innerHTML = ic('i-bookmark', 'ic-sm') + '<span>Save “' + esc(info.text) + '” to Words</span>';
  capBar.classList.add('on');
}
function capHide() { if (capBar) capBar.classList.remove('on'); capInfo = null; }
document.addEventListener('selectionchange', function () {
  clearTimeout(capTimer);
  capTimer = setTimeout(function () {
    var info = capRead();
    if (info) { capInfo = info; capShow(info); } else if (!capPress) capHide();
  }, 160);
});
function capSave() {
  var info = capInfo; if (!info || !LIVE) return;
  capPress = false;
  K.Api.call('saveWord', { text: info.text, context: info.context, skill: info.skill }).then(function (r) {
    K.toast(r.already ? '“' + info.text + '” is already saved.' : 'Saved “' + info.text + '”. It will show up in Words.');
    if (r.id && W.recent.indexOf(r.id) < 0) W.recent.push(r.id);
    if (!r.already) { W.t = null; W.sv = null; K.loadOverview(true); }
  }).catch(function (e) { K.toast((e && e.message) || 'Could not save that word.'); });
  try { window.getSelection().removeAllRanges(); } catch (e) {}
  capHide();
}
document.addEventListener('pointerup', function () { setTimeout(function () { capPress = false; }, 400); });



/* ---------- Quick words: the popup when you open Kelvin, then a reminder in the corner now and then ---------- */
/* Rules: the centre popup shows once when you open the app (while today's goal is open). After that, a corner reminder may show
   when you come back to the Dashboard or finish a practice, at most every 20 minutes, never during an exercise, and never once
   today's goal is reached. Words you saved in a practice are offered right after it. Settings > Word reminders turns it off. */
var QW = { el: null, mode: null }, welcomed = false, REMIND_GAP = 20 * 60 * 1000;
function lastShown() { try { return Number(localStorage.getItem('kelvin_qw_at')) || 0; } catch (e) { return 0; } }
function markShown() { try { localStorage.setItem('kelvin_qw_at', String(Date.now())); } catch (e) {} }
function remindOn() { return K.state.settings.quickWords !== false; }
function dueOf(w) { return w ? (w.ready ? w.due : 0) + (w.savedDue || 0) : 0; }
/* Something to do in Words today: reviews or saved words are waiting, or the daily time is not reached yet. */
function waiting(w) {
  if (!w) return 0;
  var g = w.goal, open = g ? g.doneSec < g.minutes * 60 : true;
  if (!open) return 0;
  return dueOf(w) + (w.fresh || 0) || (w.ready ? 1 : 0);
}
function qwBody() { return $('#qw-body'); }
function qwOpen(mode, html) {
  if (!QW.el) { QW.el = document.createElement('div'); QW.el.id = 'qw'; QW.el.setAttribute('role', 'dialog'); QW.el.setAttribute('aria-label', 'Quick words'); document.body.appendChild(QW.el); }
  QW.mode = mode;
  QW.el.className = 'qw on ' + (mode === 'welcome' ? 'center' : 'corner' + (mode === 'run' ? ' run' : ''));
  QW.el.setAttribute('aria-modal', mode === 'welcome' ? 'true' : 'false');
  QW.el.innerHTML = '<div class="qw-in">' + html + '</div>';
  var f = QW.el.querySelector('[data-focus]'); if (f) try { f.focus(); } catch (e) {}
}
function closeQuick() {
  if (W.run && W.run.where === 'quick') W.run = null;
  QW.mode = null; if (QW.el) { QW.el.className = 'qw'; QW.el.innerHTML = ''; }
}
function todayLine(w) { var g = w.goal; return g ? 'Today: ' + mins(g.doneSec) + ' of ' + g.minutes + ' min.' : ''; }
function showWelcome(w) {
  var parts = [], due = dueOf(w);
  if (due) parts.push(nWords(due) + ' to review');
  if (w.fresh) parts.push(nWords(w.fresh) + ' you saved to learn');
  if (!parts.length) parts.push('New words are ready');
  qwOpen('welcome', '<div class="qw-head"><span class="qw-tag">' + ic('i-cards', 'ic-sm') + 'Words</span><button class="iconbtn" data-action="qw-later" aria-label="Close">' + ic('i-x') + '</button></div>' +
    '<h2 style="font-size:22px">Ready for today\'s words?</h2><p class="muted" style="margin:8px 0 6px">' + esc(parts.join(', ')) + '.</p>' +
    '<p class="small muted">' + esc(todayLine(w)) + '</p>' +
    '<div class="row-btns mt" style="justify-content:flex-end"><button class="btn btn-ghost" data-action="qw-later">Later</button><button class="btn btn-primary" data-action="qw-start" data-focus>Start</button></div>');
}
function showRemind(w, ids) {
  var head = '<div class="qw-head"><span class="qw-tag">' + ic('i-cards', 'ic-sm') + 'Quick words</span><button class="iconbtn" data-action="qw-close" aria-label="Close">' + ic('i-x') + '</button></div>', body;
  if (ids && ids.length) {
    body = '<h3 class="qw-t">Learn the ' + (ids.length === 1 ? 'word' : nWords(ids.length)) + ' you just saved</h3><p class="small muted" style="margin:6px 0 14px">One quick look and one check each. It takes about a minute, while the sentence is still fresh.</p>' +
      '<div class="row-btns" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-action="qw-close">Not now</button><button class="btn btn-primary btn-sm" data-action="qw-go" data-ids="' + esc(ids.join(',')) + '">Learn now</button></div>';
  } else {
    var n = dueOf(w) + (w.fresh || 0);
    body = '<h3 class="qw-t">' + (n ? nWords(n) + ' waiting' : 'A minute for new words?') + '</h3><p class="small muted" style="margin:6px 0 14px">' + esc(todayLine(w)) + ' A quick round of up to 5 words takes about a minute.</p>' +
      '<div class="row-btns" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-action="qw-close">Not now</button><button class="btn btn-primary btn-sm" data-action="qw-go">Start</button></div>';
  }
  qwOpen('remind', head + body);
}
function maybeRemind(where, ids) {
  if (!LIVE || !remindOn() || QW.mode) return;
  if (ids && ids.length) { markShown(); return showRemind(null, ids); }
  var w = planWords(); if (!w || !waiting(w)) return;
  if (!welcomed) { if (where !== 'dashboard') return; welcomed = true; markShown(); return showWelcome(w); }
  if (Date.now() - lastShown() < REMIND_GAP) return;
  markShown(); showRemind(w, null);
}
function startQuick(ids) {
  if (W.run && W.run.where !== 'quick') W.run = null;
  qwOpen('run', '<div class="qw-head"><span class="qw-tag">' + ic('i-cards', 'ic-sm') + 'Quick words</span><button class="iconbtn" data-action="qw-close" aria-label="Close">' + ic('i-x') + '</button></div><div id="qw-body"><p class="muted">Getting your words…</p></div>');
  K.Api.call('wordsQuick', ids && ids.length ? { ids: ids } : {}).then(function (r) {
    if (QW.mode !== 'run') return;
    if (!startSession(r, { where: 'quick', light: true, mode: 'quick' })) { K.toast('Nothing to study right now.'); closeQuick(); }
  }).catch(function (e) { K.toast((e && e.message) || 'Could not load your words.'); closeQuick(); });
}
K.afterPractice = function () {
  var ids = W.recent.slice(); W.recent = [];
  setTimeout(function () { if (SKILLS_VIEW()) maybeRemind('practice', ids); }, 700);
};
function SKILLS_VIEW() { return K.SKILLS.indexOf(K.state.view) > -1; }
if (K.onGo) K.onGo(function (view) { if (QW.mode === 'welcome' || QW.mode === 'remind') { if (view !== 'dashboard') closeQuick(); } });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (QW.mode === 'welcome' || QW.mode === 'remind')) closeQuick(); });

/* ---------- wiring ---------- */
/* "I know it" in a list: the row goes at once, saving runs in the background. */
function knowRow(el) {
  var id = el.dataset.id, w = el.dataset.w || 'The word', keep = function (x) { return x.id !== id; };
  if (W.items && W.filter !== 'known' && W.filter !== 'all') { W.items = W.items.filter(keep); W.total = Math.max(0, W.total - 1); }
  else if (W.items) W.items.forEach(function (x) { if (x.id === id) x.status = 'knew'; });
  if (W.sv) W.sv.items.forEach(function (x) { if (x.id === id) x.status = 'knew'; });
  if (W.sv && (W.svFilter === 'due' || W.svFilter === 'new' || W.svFilter === 'learning')) W.sv.items = W.sv.items.filter(keep);
  if (W.t && W.t.stats) W.t.stats.knew = (W.t.stats.knew || 0) + 1;
  W.stale = true;
  K.toast('“' + w + '” marked as known. It will not come back.');
  draw();
  K.Api.call('wordsKnow', { id: id }).catch(function (e) { K.toast((e && e.message) || 'Could not save that. Please try again.'); W.t = null; W.items = null; W.sv = null; if (K.state.view === 'words' && !W.run) render(); });
}
K.register('words', { title: 'Words', render: function () { if (W.stale) { W.stale = false; W.t = null; } render(); } });
K.setDash(function () { dashCard(); dashStudy(); });
K.setHub(hubCard);
K.actions({
  'cap-save': capSave,
  'wd-start': function () { startToday(); },
  'wd-review': function () { if (W.stale) { W.stale = false; return moreReview(); } startReview(); },
  'wd-learn': function () { if (W.stale) { W.stale = false; return moreRound(); } startRound(); },
  'wd-more-round': function (el) { moreRound(el); },
  'wd-more-review': function (el) { moreReview(el); },
  'wd-resave': function () { var r = W.run; if (!r || !r.summary) return; r.summary = null; finish(); },
  'wd-know': function () { knowWord(); },
  'wd-hint': useHint, 'wd-hint-play': hintPlay, 'wd-tile': hintTile,
  'wd-know-row': knowRow,
  'wd-again': function (el) {
    el.disabled = true;
    K.Api.call('wordsStudyAgain', { id: el.dataset.id }).then(function () { K.toast('Back in your reviews from today.'); W.t = null; W.items = null; W.sv = null; load(); })
      .catch(function (e) { el.disabled = false; K.toast((e && e.message) || 'Could not save that.'); });
  },
  'qw-start': function () { closeQuick(); W.autoStart = true; if (K.state.view === 'words') { W.t = null; render(); } else K.go('words'); },
  'qw-later': function () { closeQuick(); markShown(); },
  'qw-close': function () { closeQuick(); markShown(); },
  'qw-go': function (el) { startQuick(el.dataset.ids ? el.dataset.ids.split(',') : null); },
  'wd-check': function (el) { startCheck(el); },
  'wd-next': next,
  'wd-pick': function (el) { pickOpt(parseInt(el.dataset.i, 10)); },
  'wd-submit': submitTyped,
  'wd-speak': function (el) { speak(el.dataset.w); },
  'wd-filter': function (el) { W.filter = el.dataset.f; W.page = 0; W.items = null; draw(); loadList(); },
  'wd-page': function (el) { W.page = Math.max(0, W.page + parseInt(el.dataset.d, 10)); W.items = null; draw(); loadList(); },
  'wd-vi': function () { W.showVi = !W.showVi; draw(); },
  'wd-vi-run': function () { var r = W.run; if (!r || r.summary) return; var s = r.steps[r.i]; s.vi = !s.vi; draw(); },
  'wd-retry': function () { W.err = null; render(); },
  'wd-sfilter': function (el) { W.svFilter = el.dataset.f; W.svPage = 0; W.sv = null; draw(); loadSaved(); },
  'wd-spage': function (el) { W.svPage = Math.max(0, W.svPage + parseInt(el.dataset.d, 10)); W.sv = null; draw(); loadSaved(); },
  'wd-sdel': function (el) {
    el.disabled = true;
    K.Api.call('savedRemove', { id: el.dataset.id }).then(function () { K.toast('Removed.'); W.t = null; load(); }).catch(function (e) { el.disabled = false; K.toast((e && e.message) || 'Could not remove it.'); });
  },
  'wd-exit': function () { K.stopSpeech(); if (W.run && W.run.where === 'quick') { closeQuick(); W.t = null; return; } W.run = null; W.t = null; W.stale = false; render(); }
});
document.addEventListener('change', function (e) {
  if (!e.target || e.target.id !== 'wd-size') return;
  var n = parseInt(e.target.value, 10);
  K.state.settings.wordsRound = n; K.persist();
  K.Api.call('saveSettings', { wordsRound: n }).then(function () { W.t = null; if (K.state.view === 'words' && !W.run) render(); }).catch(function () { K.toast('Could not save the round size.'); });
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || !W.run || W.run.summary || W.run.saving || e.isComposing) return;
  var el = e.target, r = W.run;
  if (r.fb) { if (el && el.tagName === 'BUTTON' && el.id !== 'wd-go') return; e.preventDefault(); return next(); }
  if (el && el.id === 'wd-input' && el.tagName === 'INPUT') { e.preventDefault(); submitTyped(); }
});
/* read-only helper used by the automated check of this module */
K.words = { studyMini: studyMini, gradeTyped: gradeTyped, highlight: highlight, shuffle: shuffle, speak: speak, pattern: pattern, redraw: function () { if (K.state.view === 'words') { W.t ? draw() : render(); } }, reload: function () { W.t = null; render(); }, closeRun: function () { K.stopSpeech(); W.run = null; W.t = null; }, remind: maybeRemind, quickMode: function () { return QW.mode; }, peek: function () {
  var r = W.run; if (!r || r.summary || r.saving) return null; var s = r.steps[r.i]; prep(s);
  return { t: s.t, w: s.wd.w, id: s.wd.id, box: s.wd.box || 0, clue: s.clue || '', retry: !!s.retry, fb: !!r.fb, hints: s.hints ? s.hints.length : 0, also: s.also ? s.also.map(function (c) { return c.w; }) : [],
    correct: s.opts ? s.opts.map(function (o) { return o.ok; }).indexOf(true) : null, typed: TYPED[s.t] && s.t !== 'ask' ? answerOf(s) : s.wd.w };
}, state: W };

})();
</script>
