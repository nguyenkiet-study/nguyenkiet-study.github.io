/* ---------- the interactive skill profile on the dashboard ----------
   Tap a skill (point or name) to see its detail card. Layers: Now, Last month (from the weekly level history),

   When a level changes, the shape slides from the old position to the new one. */
var RX = { sel: null, layers: { now: true, prev: false, goal: false, self: false }, prev: null };
function rxScore(k) { return li(state.skills[k].level) + (state.skills[k].progress || 0) / 100; }

  var h = state.ov && state.ov.history; if (!h) return null;

  SKILLS.forEach(function (k) { var v = (h[k] || [])[3]; if (v !== null && v !== undefined && isFinite(v)) { out[k] = LV[Math.max(0, Math.min(5, Math.floor(v)))]; any = true; } });

}
function rxGoal() { var g = {}; SKILLS.forEach(function (k) { g[k] = LV[Math.min(5, li(state.skills[k].level) + 1)]; }); return g; }

  function pt(j, fr) { var a = (-90 + j * 90) * Math.PI / 180; return [c + Math.cos(a) * R * fr, c + Math.sin(a) * R * fr]; }

  for (k = 1; k <= 6; k++) out += '<polygon class="ring" points="' + poly({ speaking: LV[k - 1], listening: LV[k - 1], reading: LV[k - 1], writing: LV[k - 1] }) + '"/>';
  for (j = 0; j < 4; j++) { var e = pt(j, 1); out += '<line class="axis" x1="' + c + '" y1="' + c + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '"/>'; }
  for (k = 1; k <= 6; k++) { var m = pt(0, k / 6); out += '<text class="ringlab" x="' + (m[0] + 5).toFixed(1) + '" y="' + (m[1] + 11).toFixed(1) + '">' + LV[k - 1] + '</text>'; }

  if (o.self) out += '<polygon class="poly-self" points="' + poly(o.self) + '"/>';

    SKILLS.forEach(function (k, j) {
      var p = pt(j, fr(levels, k)), q = o.from ? pt(j, fr(o.from, k)) : p, moved = o.from && (q[0] !== p[0] || q[1] !== p[1]);

      out += '<circle class="pt' + (k === weak ? ' weak' : '') + (k === sel ? ' on' : '') + '" r="' + (k === sel ? 8 : 6) + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" style="fill:var(--c-' + k + ')">' + anim + '</circle>';
    });
    out += '</g>';
  }
  var L = [{ x: c, y: c - R - 34, an: 'middle' }, { x: c + R + 16, y: c - 2, an: 'start' }, { x: c, y: c + R + 28, an: 'middle' }, { x: c - R - 16, y: c - 2, an: 'end' }];
  SKILLS.forEach(function (k, j) {

      '<circle r="24" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" fill="transparent"/>' +
      '<rect x="' + (L[j].an === 'end' ? L[j].x - 96 : L[j].an === 'start' ? L[j].x - 4 : L[j].x - 50) + '" y="' + (L[j].y - 16) + '" width="100" height="38" rx="8" fill="transparent"/>' +

function rxCard(k, weak, prevMonth) {

  return '<div class="rx-head sk-' + k + '"><span class="tint dot">' + ic(SK[k].icon, 'ic-sm') + '</span><b>' + SK[k].label + '</b><span class="muted small">' + s.level + ' ' + esc(LV_NAME[s.level] || '') + '</span>' +

/* ---------- API layer ---------- */
var Api = {
  call: function (fn, payload) {

    return new Promise(function (resolve, reject) {

function mockApi(fn, p, ok, fail) {

/* ---------- session / data ---------- */
function loadData(hasTest, selfLevels, goals, realSkills) {
  state.hasTest = hasTest;
  state.goals = goals || (BACKEND_READY ? [] : MOCK.goals);
  state.self = selfLevels || (BACKEND_READY ? {} : MOCK.self);
  if (hasTest && BACKEND_READY) {
    state.skills = {};
    SKILLS.forEach(function (k) { state.skills[k] = (realSkills && realSkills[k]) || { level: state.self[k] || 'B1', progress: 0, measured: false }; });
    state.totals = { hours: 0, lessons: 0, streak: 0 };
    state.weekly = [0, 0, 0, 0, 0, 0, 0];
    state.recent = [];
  } else if (hasTest) {
    state.skills = JSON.parse(JSON.stringify(MOCK.skills));
    state.totals = JSON.parse(JSON.stringify(MOCK.totals));
    state.weekly = MOCK.weekly.slice();
    state.recent = MOCK.recent.slice();
  } else {
    state.skills = {};

/** Applies what the server returns after sign-in, registration or a restored session. */
function applyBootstrap(r) {
  state.token = r.token; state.user = r.user; state.onboarded = !!r.onboarded;
  if (r.settings) state.settings = Object.assign(state.settings, r.settings);
  var self = r.self && Object.keys(r.self).length ? r.self : null;
  loadData(!!r.hasTest, self, r.goals && r.goals.length ? r.goals : null, r.skills);
  try { localStorage.setItem('kelvin_tok', r.token); } catch (e) { /* storage can be blocked inside the Apps Script frame */ }
}
function persist() { store('kelvin', { token: state.token, user: state.user, hasTest: state.hasTest, self: state.self, goals: state.goals, settings: state.settings, onboarded: !!state.onboarded }); }

/* ---------- screens ---------- */
function showScreen(name) {
  ['auth', 'onboarding', 'app'].forEach(function (s) { $('#screen-' + s).hidden = s !== name; });
  window.scrollTo(0, 0);
}

/* ---------- auth ---------- */
function setAuthTab(tab) {
  var reg = tab === 'register';
  $('#tab-login').setAttribute('aria-selected', String(!reg));
  $('#tab-register').setAttribute('aria-selected', String(reg));
  $('#form-login').hidden = reg; $('#form-register').hidden = !reg;
  $('#auth-title').textContent = reg ? 'Create your account' : 'Welcome back';
  $('#auth-sub').textContent = reg ? 'It takes about a minute. Then we set up your learning profile.' : 'Sign in to continue where you left off.';
}
function validUsername(u) { return /^[A-Za-z0-9._-]{3,20}$/.test(u); }
function validPass(p) { return p.length >= 1; }
function bad(form, name, isBad) { var f = $('[data-f="' + name + '"]', form); if (f) f.classList.toggle('bad', isBad); return isBad; }
function banner(id, msg) { var b = $(id); b.textContent = msg || ''; b.classList.toggle('show', !!msg); }

function submitLogin(ev) {
  ev.preventDefault();
  var f = ev.target, username = f.username.value.trim().toLowerCase(), pw = f.password.value;
  banner('#login-banner');
  var e1 = bad(f, 'username', !validUsername(username)), e2 = bad(f, 'password', !pw);
  if (e1 || e2) return;
  var btn = $('#login-btn'); btn.disabled = true; btn.textContent = 'Signing in…';
  Api.call('login', { username: username, password: pw }).then(function (r) {
    applyBootstrap(r); persist(); r.onboarded ? enterApp('dashboard') : startOnboarding();
  }).catch(function (e) { banner('#login-banner', (e && e.message) || 'Could not sign in. Check your details and try again.'); })
    .then(function () { btn.disabled = false; btn.textContent = 'Sign in'; });
}
function submitRegister(ev) {
  ev.preventDefault();
  var f = ev.target, name = f.name.value.trim(), username = f.username.value.trim().toLowerCase(), pw = f.password.value, cf = f.confirm.value, invite = f.invite.value.trim();
  banner('#register-banner');
  var errs = [bad(f, 'name', name.length < 2), bad(f, 'username', !validUsername(username)), bad(f, 'password', !validPass(pw)), bad(f, 'confirm', pw !== cf || !cf), bad(f, 'invite', !$('[data-f="invite"]', f).hidden && !invite)];
  if (errs.some(Boolean)) return;
  var btn = $('#register-btn'); btn.disabled = true; btn.textContent = 'Creating account…';
  Api.call('register', { name: name, username: username, password: pw, invite: invite }).then(function (r) {
    applyBootstrap(r); persist(); startOnboarding();
  }).catch(function (e) { banner('#register-banner', (e && e.message) || 'Could not create your account. Try again in a moment.'); })
    .then(function () { btn.disabled = false; btn.textContent = 'Create account'; });
}
function logout() {
  if (state.token) Api.call('logout').catch(function () {});
  try { localStorage.removeItem('kelvin_tok'); } catch (e) {}
  clearTimers(); store('kelvin', null); state.user = null; state.token = null; state.hasTest = false;
  $('#form-login').reset(); $('#form-register').reset();
  setAuthTab('login'); showScreen('auth');
}

/* ---------- onboarding ---------- */
var OB_STEPS = ['Welcome', 'Level', 'Skills', 'Goals'];
function startOnboarding() {

  showScreen('onboarding'); renderOb();
}
function obValid() {
  var o = state.ob;
  if (o.step === 1) return !!o.overall;
  if (o.step === 3) return o.goals.length > 0;
  return true;
}
function renderOb() {
  var o = state.ob, h = '';

    return (i ? '<i class="sep"></i>' : '') + '<span class="st ' + (i === o.step ? 'on ' : '') + (i < o.step ? 'done' : '') + '"><b>' + (i < o.step ? ic('i-check', 'ic-sm') : i + 1) + '</b><span>' + s + '</span></span>';
  }).join('');
  var foot = function (next) {
    return '<div class="ob-foot">' + (o.step > 0 ? '<button class="btn btn-ghost" data-action="ob-back">' + ic('i-back', 'ic-sm') + 'Back</button>' : '<span></span>') +
      '<button class="btn btn-primary" data-action="ob-next" ' + (obValid() ? '' : 'disabled') + '>' + next + '</button></div>';

      '<p class="lead">Two quick questions about your English, then your goals. After that, a short placement test measures each skill separately, so your plan starts from where you really are.</p>' +
      '<div class="grid g-2" style="max-width:640px"><div class="card"><b>About 2 minutes</b><p class="muted small">Setup takes less time than a coffee.</p></div><div class="card"><b>About 20 minutes</b><p class="muted small">The placement test, whenever you are ready.</p></div></div>' +
      foot('Get started') + '</div>';
  } else if (o.step === 1) {
    h = '<div class="ob-step"><h1>What is your English level today?</h1><p class="lead">Your best guess is fine. The placement test will check it.</p><div class="lvl-grid">' +
      LV.map(function (l) { return '<button class="lvl" data-action="ob-level" data-l="' + l + '" aria-pressed="' + (o.overall === l) + '"><div class="code">' + l + '</div><div class="nm">' + LV_NAME[l] + '</div><div class="can">' + LV_CAN[l] + '</div></button>'; }).join('') +
      '</div>' + foot('Continue') + '</div>';
  } else if (o.step === 2) {
    h = '<div class="ob-step"><h1>Estimate each skill</h1><p class="lead">Most people are stronger in some skills than others. These are starting points only. The test measures your real level for each one.</p>' +
      '<div class="sk-split"><div class="card" style="padding-top:8px;padding-bottom:8px">' + SKILLS.map(function (k) {
        return '<div class="sk-row sk-' + k + '"><div class="srt"><span class="tint">' + ic(SK[k].icon, 'ic-sm') + '</span>' + SK[k].label + '<span class="pill lvl" style="margin-left:auto">' + o.skills[k] + '</span></div><div class="seg" role="group" aria-label="' + SK[k].label + ' level">' +
          LV.map(function (l) { return '<button data-action="ob-skill" data-k="' + k + '" data-l="' + l + '" aria-pressed="' + (o.skills[k] === l) + '">' + l + '</button>'; }).join('') + '</div></div>';
      }).join('') + '</div><div class="card" style="position:sticky;top:20px"><div class="card-head"><h2>Your starting profile</h2></div><div id="ob-radar"></div></div></div>' + foot('Continue') + '</div>';
  } else {
    h = '<div class="ob-step"><h1>What do you want English for?</h1><p class="lead">Choose everything that applies. Your exercises will use these situations.</p><div class="goal-grid">' +
      GOALS.map(function (g) { var on = o.goals.indexOf(g.id) > -1; return '<button class="goal" data-action="ob-goal" data-g="' + g.id + '" aria-pressed="' + on + '"><span class="chk">' + ic('i-check', 'ic-sm') + '</span><span><div class="ttl">' + g.label + '</div><div class="d">' + g.desc + '</div></span></button>'; }).join('') +
      '</div>' + foot('Finish setup') + '</div>';

function obNext() {
  var o = state.ob;
  if (!obValid()) return;
  if (o.step === 1) SKILLS.forEach(function (k) { if (!o.skills[k]) o.skills[k] = o.overall; });
  if (o.step < 3) { o.step++; return renderOb(); }
  var btn = $('[data-action="ob-next"]'); btn.disabled = true; btn.textContent = 'Saving…';
  Api.call('saveOnboarding', { overall: o.overall, skills: o.skills, goals: o.goals }).then(function () {
    state.onboarded = true; loadData(false, JSON.parse(JSON.stringify(o.skills)), o.goals.slice()); persist(); enterApp('dashboard'); toast('Profile saved. Next: take the placement test.');
  }).catch(function () { toast('Could not save your profile. Try again.'); btn.disabled = false; btn.textContent = 'Finish setup'; });
}

/* ---------- dashboard pieces: progress rings, continue list, study calendar, time by skill ---------- */

function demoMix() { return { words: 64, reading: 28, listening: 22, speaking: 12, writing: 8 }; }

document.addEventListener('click', function (ev) {

document.addEventListener('change', function (ev) {
